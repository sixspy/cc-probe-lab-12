<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>站点汇总账 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">站点汇总账</h1>
      <div class="骨">结栏后按站点+指标物化；<b>汇总编号与分组键同票</b>，现行账只读契约键集。</div>
    </header>

    <section class="卷">
      <h2>汇总键契约针</h2>
      <div id="契约条" class="只读框">契约加载中…</div>
      <div class="工具 上距12">
        <button class="按钮 青" id="结">结当前栏</button>
        <button class="按钮 次" id="刷裁决">刷新键裁决</button>
        <label class="说明"><input type="checkbox" id="全量"/> 显示全量正式行（含被判错键者）</label>
      </div>
      <pre class="回执 上距12" id="回执">操作回执会显示在这里</pre>
    </section>

    <section class="卷">
      <h2>现行汇总账（契约键）</h2>
      <div class="表绕"><table><thead><tr>
        <th>汇总编号＝契约键</th><th>栏号</th><th>站点</th><th>指标</th>
        <th>报文数</th><th>均值</th><th>契约指纹</th><th>裁决</th>
      </tr></thead><tbody id="表"></tbody></table></div>
    </section>

    <section class="卷" id="裁决区">
      <h2>汇总键裁决（只读）</h2>
      <p class="说明" id="裁决结论">—</p>
      <div class="表绕"><table><thead><tr>
        <tr><th>契约键</th><th>栏号</th><th>站点</th><th>指标</th><th>缓冲键</th><th>现行可回读契约</th><th>裁决</th></tr>
      </tr></thead><tbody id="裁决表"></tbody></table></div>
    </section>

    <section class="卷">
      <h2>错键影子归档（只读，不参与贯验对齐）</h2>
      <div class="表绕"><table><thead><tr>
        <tr><th>归档号</th><th>错汇总编号</th><th>应有契约键</th><th>站点</th><th>指标</th><th>报文数</th><th>裁决</th><th>时刻</th></tr>
      </tr></thead><tbody id="归档表"></tbody></table></div>
    </section>

    <script>
    async function 刷契约条() {
      try {
        const d = await 探栏.getJSON("/api/汇总键契约");
        const p = d["现行针"] || {};
        document.getElementById("契约条").innerHTML =
          `<b class="铜字">${探栏.安全文本(d["形态"] || p["形态"] || "")}</b> · 策略 ${探栏.安全文本(d["策略"] || p["策略"] || "")}<br/>` +
          `编号规则 <code>${探栏.安全文本(d["编号规则"] || p["编号规则"] || "汇-{栏号}-{站点键}-{指标键}")}</code><br/>` +
          `现行契约指纹 <code>${探栏.安全文本(p["契约指纹"] || "")}</code> · 账册针 ${(d["账册"] || []).length} 枚`;
      } catch (e) { document.getElementById("契约条").textContent = String(e); }
    }

    async function 刷账() {
      const 全量 = document.getElementById("全量").checked;
      const rows = await 探栏.getJSON("/api/站点汇总账" + (全量 ? "?全量=1" : ""));
      const tb = document.getElementById("表"); tb.innerHTML = "";
      if (!rows.length) {
        tb.innerHTML = `<tr><td colspan="8">${探栏.空态("尚无现行汇总。入栏后点结当前栏；错键只会进影子归档。")}</td></tr>`;
      }
      for (const r of rows) {
        const tone = 探栏.裁决调(r.裁决);
        const fp = String(r.契约指纹 || "").slice(0, 12);
        tb.appendChild(探栏.行(
          `<td><code class="票">${探栏.安全文本(r.契约键 || r.汇总编号)}</code></td>` +
          `<td>${探栏.安全文本(r.栏号)}</td><td>${探栏.安全文本(r.站点键)}</td><td>${探栏.安全文本(r.指标键)}</td>` +
          `<td>${r.报文数}</td><td>${r.均值}</td>` +
          `<td><code>${探栏.安全文本(fp)}</code></td>` +
          `<td>${探栏.徽章(r.裁决 || "契约对齐", tone)}</td>`));
      }
    }

    async function 刷裁决() {
      const d = await 探栏.getJSON("/api/汇总键裁决");
      document.getElementById("裁决结论").textContent =
        `${d["结论"]} · 现行 ${d["计数"]["现行"]} · 错键正式行 ${d["计数"]["错键正式行"]} · 影子归档 ${d["计数"]["影子归档"]}`;
      const tb = document.getElementById("裁决表"); tb.innerHTML = "";
      for (const k of (d["键视图"] || [])) {
        tb.appendChild(探栏.行(
          `<td><code class="票">${探栏.安全文本(k.契约键)}</code></td>` +
          `<td>${探栏.安全文本(k.栏号)}</td><td>${探栏.安全文本(k.站点键)}</td><td>${探栏.安全文本(k.指标键)}</td>` +
          `<td><code>${探栏.安全文本(k.分组键)}</code></td>` +
          `<td>${k.现行可回读契约 ? 探栏.徽章("可回读", "ok") : 探栏.徽章("不可回读", "warn")}</td>` +
          `<td>${探栏.徽章(k.裁决, 探栏.裁决调(k.裁决))}</td>`));
      }
      const ab = document.getElementById("归档表"); ab.innerHTML = "";
      const shadows = d["影子"] || [];
      if (!shadows.length) ab.innerHTML = `<tr><td colspan="8">${探栏.空态("无错键影子。")}</td></tr>`;
      for (const s of shadows) {
        ab.appendChild(探栏.行(
          `<td>${探栏.安全文本(s.归档号)}</td>` +
          `<td><code>${探栏.安全文本(s.汇总编号)}</code></td>` +
          `<td><code class="票">${探栏.安全文本(s.应有契约键)}</code></td>` +
          `<td>${探栏.安全文本(s.站点键)}</td><td>${探栏.安全文本(s.指标键)}</td>` +
          `<td>${s.报文数}</td><td>${探栏.徽章(s.裁决, "warn")}</td><td>${探栏.安全文本(s.时刻)}</td>`));
      }
    }

    async function 全刷() { await Promise.all([刷契约条(), 刷账(), 刷裁决()]); }
    document.getElementById("结").onclick = async () => {
      const el = document.getElementById("回执");
      try { el.textContent = JSON.stringify(await 探栏.postJSON("/api/结栏/跑"), null, 2); }
      catch (e) { el.textContent = String(e); }
      await 全刷();
    };
    document.getElementById("刷裁决").onclick = () => 刷裁决();
    document.getElementById("全量").onchange = () => 刷账();
    全刷();
    </script>
  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" class="亮">站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" >栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
