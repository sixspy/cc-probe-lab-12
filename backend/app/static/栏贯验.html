<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>栏贯验 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">栏贯验</h1>
      <div class="骨">契约键级互证：已汇总缓冲的 (栏号·站点·指标) 键，须与现行契约汇总键一一对应；错键影子不得充绿。</div>
    </header>

    <section class="卷">
      <div class="工具">
        <button class="按钮" id="跑">跑栏贯验</button>
        <span id="果"></span>
        <span class="说明" id="契约针"></span>
      </div>
      <p class="说明 上距8" id="键说明">键级详情加载中…</p>
      <div class="表绕">
        <table><thead><tr>
          <th>契约键</th><th>栏号</th><th>站点</th><th>指标</th>
          <th>缓冲报文数</th><th>现行契约报文数</th><th>影子报文数</th><th>裁决</th>
        </tr></thead><tbody id="键级表"></tbody></table>
      </div>
    </section>

    <section class="卷">
      <h2>历次贯验</h2>
      <div class="表绕"><table><thead><tr>
        <th>时刻</th><th>在栏</th><th>契约汇总报文</th><th>坏点</th><th>结果</th><th>说明</th>
      </tr></thead><tbody id="表"></tbody></table></div>
    </section>

    <script>
    function 渲染键级(键级) {
      const tb = document.getElementById("键级表"); tb.innerHTML = "";
      const rows = 键级 || [];
      if (!rows.length) {
        tb.innerHTML = `<tr><td colspan="8">${探栏.空态("尚无键级数据。灌入样例 → 结栏 → 跑栏贯验。")}</td></tr>`;
        return;
      }
      for (const k of rows) {
        tb.appendChild(探栏.行(
          `<td><code class="票">${探栏.安全文本(k.契约键)}</code></td>` +
          `<td>${探栏.安全文本(k.栏号)}</td><td>${探栏.安全文本(k.站点键)}</td><td>${探栏.安全文本(k.指标键)}</td>` +
          `<td>${k.缓冲报文数}</td><td>${k.现行报文数}</td><td>${k.影子报文数 || 0}</td>` +
          `<td>${探栏.徽章(k.裁决, 探栏.裁决调(k.裁决))}</td>`));
      }
    }

    async function 刷快照() {
      try {
        const s = await 探栏.getJSON("/api/栏贯验/快照");
        渲染键级(s["键级"]);
        document.getElementById("契约针").textContent = "契约指纹 " + (s["契约指纹"] || "—")
          + " · 错键报文 " + (s["错键报文"] || 0) + " · 影子报文 " + (s["影子报文"] || 0);
      } catch (e) { /* 快照仅预览 */ }
    }

    async function 刷历史() {
      const rows = await 探栏.getJSON("/api/栏贯验");
      const tb = document.getElementById("表"); tb.innerHTML = "";
      for (const r of rows) {
        const ok = r.是否对齐 ? 探栏.徽章("对齐", "好") : 探栏.徽章("撕裂", "危");
        tb.appendChild(探栏.行(
          `<td>${探栏.安全文本(r.时刻)}</td><td>${r.在栏笔数}</td>` +
          `<td>${r.契约汇总报文 ?? r.汇总报文数}</td><td>${r.坏点笔数}</td>` +
          `<td>${ok}</td><td>${探栏.安全文本(r.说明)}</td>`));
      }
    }

    document.getElementById("跑").onclick = async () => {
      const d = await 探栏.postJSON("/api/栏贯验/跑");
      document.getElementById("果").innerHTML = d.是否对齐
        ? 探栏.徽章("契约对齐", "好") : 探栏.徽章("契约撕裂", "危");
      渲染键级(d["键级"]);
      document.getElementById("契约针").textContent = "契约指纹 " + (d["契约指纹"] || "—")
        + " · 错键报文 " + (d["错键报文"] || 0) + " · 影子报文 " + (d["影子报文"] || 0);
      await 刷历史();
    };
    刷快照();
    刷历史();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" class="亮">栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
