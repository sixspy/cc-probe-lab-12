<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>入栏缓冲 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">入栏缓冲</h1>
      <div class="骨">过门槛、尚未结栏汇总的在途集合。每张缓冲卡片都标出结栏后将物化的<b>契约键</b>（与汇总编号同票）。</div>
    </header>

    <section class="卷">
      <h2>缓冲卡片 · 每卡可见契约键</h2>
      <div class="卡阵" id="缓冲卡片"><p class="说明">加载中…</p></div>
    </section>

    <section class="卷">
      <h2>缓冲明细表（含契约键列）</h2>
      <div class="表绕"><table><thead><tr>
        <th>报文编号</th><th>站点</th><th>指标</th><th>读数</th><th>栏号</th>
        <th>契约键（＝将生成的汇总编号）</th><th>命运</th>
      </tr></thead><tbody id="表"></tbody></table></div>
    </section>

    <script>
    (async () => {
      const rows = await 探栏.getJSON("/api/入栏缓冲");
      const cards = document.getElementById("缓冲卡片");
      const tb = document.getElementById("表");
      cards.innerHTML = ""; tb.innerHTML = "";
      if (!rows.length) {
        cards.innerHTML = 探栏.空态("缓冲为空。");
        tb.innerHTML = `<tr><td colspan="7">${探栏.空态("缓冲为空。")}</td></tr>`;
        return;
      }
      for (const r of rows) {
        const 键 = r.契约键 || 探栏.契约票(r.栏号, r.站点键, r.指标键);
        const card = document.createElement("div");
        card.className = "键卡";
        card.innerHTML =
          `<div class="键卡顶"><b>${探栏.安全文本(r.报文编号)}</b> ${探栏.徽章(r.命运)}</div>` +
          `<div class="说明">${探栏.安全文本(r.站点键)} · ${探栏.安全文本(r.指标键)} · 读数 ${r.读数}</div>` +
          `<div class="键行"><span class="键标">契约键</span><code class="票">${探栏.安全文本(键)}</code></div>` +
          `<div class="说明">栏号 ${探栏.安全文本(r.栏号)} · 指纹 ${探栏.安全文本(String(r.契约指纹 || "").slice(0, 12) || "—")}</div>`;
        cards.appendChild(card);

        tb.appendChild(探栏.行(
          `<td>${探栏.安全文本(r.报文编号)}</td><td>${探栏.安全文本(r.站点键)}</td>` +
          `<td>${探栏.安全文本(r.指标键)}</td><td>${r.读数}</td><td>${探栏.安全文本(r.栏号)}</td>` +
          `<td><code class="票">${探栏.安全文本(键)}</code></td><td>${探栏.徽章(r.命运)}</td>`));
      }
    })();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" class="亮">入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" >栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
